name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --project pipeline --locked --python 3.12
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      - run: .venv/bin/python -m unittest discover -s pipeline/tests -v
      - run: .venv/bin/python -m elections.cli validate-release --release data/fixtures/public --deep-schema

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /elections-check/
      - run: npx playwright install --with-deps chrome
      - run: npm run test:browser
        env:
          BASE_PATH: /elections-check/
          E2E_PREVIEW: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chrome-failure-report
          path: web/playwright-report/
