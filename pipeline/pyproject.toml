[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elections"
version = "0.1.0"
description = "Auditable ecological-inference data preparation and publication"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3,<3",
    "scipy>=1.16,<2",
    "jsonschema>=4.23,<5",
    "pandas>=2.2,<3",
]

[project.scripts]
elections = "elections.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
